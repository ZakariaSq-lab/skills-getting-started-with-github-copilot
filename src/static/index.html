<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mergington High School Activities</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <h1>Mergington High School</h1>
      <h2>Extracurricular Activities</h2>
    </header>

    <main>
      <section id="activities-container">
        <h3>Available Activities</h3>
        <div id="activities-list">
          <!-- Activities will be loaded here -->
          <p>Loading activities...</p>
        </div>
      </section>

      <section id="signup-container">
        <h3>Sign Up for an Activity</h3>
        <form id="signup-form">
          <div class="form-group">
            <label for="email">Student Email:</label>
            <input type="email" id="email" required placeholder="your-email@mergington.edu" />
          </div>
          <div class="form-group">
            <label for="activity">Select Activity:</label>
            <select id="activity" required>
              <option value="">-- Select an activity --</option>
              <!-- Activity options will be loaded here -->
            </select>
          </div>
          <button type="submit">Sign Up</button>
        </form>
        <div id="message" class="hidden"></div>
      </section>
    </main>

    <footer>
      <p>&copy; 2023 Mergington High School</p>
    </footer>

    <script>
      document.addEventListener('DOMContentLoaded', () => {
        const activitiesList = document.getElementById('activities-list');
        const activitySelect = document.getElementById('activity');
        const signupForm = document.getElementById('signup-form');
        const messageEl = document.getElementById('message');

        function showMessage(text, type = 'info') {
          messageEl.textContent = text;
          messageEl.className = '';
          messageEl.classList.add('message', type);
          messageEl.classList.remove('hidden');
          setTimeout(() => messageEl.classList.add('hidden'), 4000);
        }

        function renderActivities(data) {
          activitiesList.innerHTML = '';
          activitySelect.innerHTML = '<option value="">-- Select an activity --</option>';

          Object.keys(data).forEach(name => {
            const activity = data[name];

            // create activity card element
            const card = document.createElement('div');
            card.className = 'activity-card';

            card.innerHTML = `
              <h4>${name}</h4>
              <p>${activity.description}</p>
              <p><strong>Schedule:</strong> ${activity.schedule}</p>
              <div class="participants">
                <h5>Participants <span class="participant-count">(${activity.participants.length})</span></h5>
                ${activity.participants.length ? `
                  <ul>
                    ${activity.participants.map(p => `<li><span class="participant-pill">${escapeHtml(p)}</span><button class="delete-btn" data-activity="${escapeHtml(name)}" data-email="${escapeHtml(p)}" title="Unregister">×</button></li>`).join('')}
                  </ul>` :
                  `<div class="none">No participants yet.</div>`
                }
              </div>
            `;

            activitiesList.appendChild(card);

            // add option to select
            const opt = document.createElement('option');
            opt.value = name;
            opt.textContent = name;
            activitySelect.appendChild(opt);
          });
        }

        function escapeHtml(str) {
          return String(str)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
        }

        // initial fetch (no-cache to ensure fresh data)
        fetch('/activities', { cache: 'no-store' })
          .then(r => {
            if (!r.ok) throw new Error('Failed to load activities');
            return r.json();
          })
          .then(data => renderActivities(data))
          .catch(() => {
            activitiesList.innerHTML = '<p class="error">Unable to load activities at this time.</p>';
          });

        // signup handler
        signupForm.addEventListener('submit', (e) => {
          e.preventDefault();
          const email = document.getElementById('email').value.trim();
          const activityName = activitySelect.value;

          if (!email || !activityName) {
            showMessage('Please provide both email and activity.', 'error');
            return;
          }

          const url = `/activities/${encodeURIComponent(activityName)}/signup?email=${encodeURIComponent(email)}`;

          fetch(url, { method: 'POST' })
            .then(async res => {
              const text = await res.text();
              if (!res.ok) {
                let detail = text || 'Signup failed';
                try {
                  const j = JSON.parse(text);
                  detail = j.detail || detail;
                } catch (_) {}
                throw new Error(detail);
              }
              return text;
            })
            .then(() => {
              showMessage(`Signed up ${email} for ${activityName}`, 'success');
              // update UI participants list for that activity
              // re-fetch full activities (force fresh) to keep things simple and consistent
              return fetch('/activities', { cache: 'no-store' });
            })
            .then(r => r.json())
            .then(data => renderActivities(data))
            .catch(err => showMessage(err.message || 'Signup failed', 'error'));
        });

        // delegate click handler for unregister buttons
        activitiesList.addEventListener('click', (e) => {
          const btn = e.target.closest('.delete-btn');
          if (!btn) return;
          const activityName = btn.getAttribute('data-activity');
          const email = btn.getAttribute('data-email');

          if (!activityName || !email) return;

          if (!confirm(`Unregister ${email} from ${activityName}?`)) return;

          const url = `/activities/${encodeURIComponent(activityName)}/unregister?email=${encodeURIComponent(email)}`;

          fetch(url, { method: 'DELETE' })
            .then(async res => {
              const text = await res.text();
              if (!res.ok) {
                let detail = text || 'Unregister failed';
                try {
                  const j = JSON.parse(text);
                  detail = j.detail || detail;
                } catch (_) {}
                throw new Error(detail);
              }
              return text;
            })
            .then(() => {
              showMessage(`Unregistered ${email} from ${activityName}`, 'success');
              return fetch('/activities', { cache: 'no-store' });
            })
            .then(r => r.json())
            .then(data => renderActivities(data))
            .catch(err => showMessage(err.message || 'Unregister failed', 'error'));
        });
      });
    </script>
  </body>
</html>
